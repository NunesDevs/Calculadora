<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Calculadora com operações, parênteses, decimais e controle por teclado.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../styles/home.css">
<script defer src="../js/index.js">
</script>
<title>Calculadora</title>
</head>
<body>
<main class="container">
<header>
<p class="eyebrow">Ferramentas</p>
<h1>Calculadora</h1>
<p>Operações, parênteses e decimais em um só lugar.</p>
</header>
<section class="calculator" aria-label="Calculadora aritmética">
<div class="display">
<label for="result">Expressão</label>
<p id="history" aria-label="Última expressão">
</p>
<input id="result" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="256" placeholder="0" aria-describedby="feedback keyboard-help">
</div>
<div class="keys" aria-label="Teclado da calculadora">
<button type="button" class="utility" data-action="clear" aria-label="Limpar">C</button>
<button type="button" class="utility" data-value="(" aria-label="Abrir parênteses">(</button>
<button type="button" class="utility" data-value=")" aria-label="Fechar parênteses">)</button>
<button type="button" class="operator" data-value="/" aria-label="Dividir">÷</button>
<button type="button" class="number" data-value="7" aria-label="7">7</button>
<button type="button" class="number" data-value="8" aria-label="8">8</button>
<button type="button" class="number" data-value="9" aria-label="9">9</button>
<button type="button" class="operator" data-value="*" aria-label="Multiplicar">×</button>
<button type="button" class="number" data-value="4" aria-label="4">4</button>
<button type="button" class="number" data-value="5" aria-label="5">5</button>
<button type="button" class="number" data-value="6" aria-label="6">6</button>
<button type="button" class="operator" data-value="-" aria-label="Subtrair">−</button>
<button type="button" class="number" data-value="1" aria-label="1">1</button>
<button type="button" class="number" data-value="2" aria-label="2">2</button>
<button type="button" class="number" data-value="3" aria-label="3">3</button>
<button type="button" class="operator" data-value="+" aria-label="Somar">+</button>
<button type="button" class="number" data-value="," aria-label="Vírgula decimal">,</button>
<button type="button" class="number" data-value="0" aria-label="0">0</button>
<button type="button" class="utility" data-action="backspace" aria-label="Apagar último caractere">
<img src="../assets/backspace.svg" width="24" height="24" alt="">
</button>
<button type="button" class="equal" data-action="calculate" aria-label="Calcular">=</button>
</div>
<p id="feedback" role="status" aria-live="polite" aria-atomic="true">Digite a expressão e calcule.</p>
</section>
<p id="keyboard-help">Enter: calcular · Esc: limpar</p>
</main>
</body>
</html>
